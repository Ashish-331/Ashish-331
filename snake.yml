# ============================================================
#  SNAKE ANIMATION WORKFLOW
#  Place this file at:  .github/workflows/snake.yml
#  inside your profile repository (the repo named like you).
#
#  It runs once every 24h, draws a snake that "eats" your
#  contribution graph, and saves the animation to a branch
#  called "output", which README.md embeds as an image.
#
#  ONE-TIME SETUP after uploading this file:
#   1. Repo -> Settings -> Actions -> General ->
#      "Workflow permissions" -> choose
#      "Read and write permissions" -> Save.
#   2. Repo -> Actions tab -> click "I understand my workflows..."
#      -> open "Generate Snake" -> Run workflow (or just wait
#      for the daily schedule).
# ============================================================

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"          # every day at 00:00 UTC
  workflow_dispatch:              # allows manual run from Actions tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write             # needed to push the generated SVG
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
