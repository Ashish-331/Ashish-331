# ============================================================
#  PROFILE ANIMATIONS — snake + trophies
#  Correct location inside the repo:
#    .github/workflows/profile.yml
#
#  Generates:
#    dist/snake.svg       (light-mode contribution snake)
#    dist/snake-dark.svg  (dark-mode snake)
#    dist/trophy.svg      (GitHub trophies, dracula theme)
#  then publishes all three to a branch called "output",
#  which README.md embeds as images.
#
#  Runs daily at 00:00 UTC, on every push to main, and can
#  be triggered manually from the Actions tab.
# ============================================================

name: Generate Profile Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # required to push files to the output branch
    steps:
      - name: Prepare output folder
        run: mkdir -p dist

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Generate trophies
        uses: ryo-ma/github-profile-trophy@v1.0
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: dracula
          output_path: dist/trophy.svg

      - name: Publish generated files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
